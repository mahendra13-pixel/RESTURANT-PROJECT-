<!DOCTYPE html>
<html lang="en">
  {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
<!-- JavaScript -->
<script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'css/register.css' %}">


<style>
  .cross{
    position: absolute;
    top: 0;
    right: 8px;
  }
  .cross:hover{
   color: blue;
   scale: 1.2;
  }
</style>

</head>
<body>


    <!-- From Uiverse.io by marc_remus --> 
     
<form class="form " method="post" action="{% url 'register' %}">
  {% csrf_token %}
  <a href="{% url 'index' %}"><h2 class="cross"><i class="fa-solid fa-x"></i></h2></a>
  <p class="title">Register</p>
  <p class="message">Signup now and get full access to our app.</p>
  <div class="flex">
    <label>
      <input required="" placeholder="" type="text" name="fname" class="input" />
      <span>Firstname</span>
    </label>

    <label>
      <input required="" placeholder="" type="text" name="lname" class="input" />
      <span>Lastname</span>
    </label>
  </div>
  <label>
      <input required="" placeholder="" type="text" name="username" class="input" />
      <span>UserName</span>
    </label>

  <label>
    <input required="" placeholder="" type="email" name="email" class="input" />
    <span>Email</span>
  </label>

  <label>
    <input required="" placeholder="" type="password" name="password" class="input" />
    <span>Password</span>
  </label>
  <label>
    <input required="" placeholder="" type="password" name="password1" class="input" />
    <span>Confirm password</span>
  </label>
  <button class="submit">Sign UP</button>
  <p class="signin">Already have an acount ? <a href="{% url 'log_in' %}">SignIn</a></p>
</form>
  {% if messages %}
    {% for message in messages %}
    {% if message.tags == 'success' %}
       <script>
      alertify.set('notifier','position', 'bottom-right');
      alertify.success('{{message}}');
    </script>
    {% else %}
    <script>
      alertify.set('notifier','position', 'bottom-right');
      alertify.error('{{message}}');
    </script>
       {% endif %}
    {% endfor %}
  {% endif %}
</body>
</html>
