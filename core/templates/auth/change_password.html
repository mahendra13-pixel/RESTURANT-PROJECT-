
<!DOCTYPE html>
<html lang="en">
  {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- JavaScript -->
<script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'css/register.css' %}">


<style>
  .cross{
    position: absolute;
    top: 0;
    right: 8px;
  }
  .cross:hover{
    color: blue;
   scale: 1.2;
  }
 #toogglepassword{
  position: absolute;
  right: 4%;
  top: 40%;

}
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  min-height: 100vh;
  background: #f3f6fd;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card */
.form {
  position: relative;
  width: 420px;
  background: #ffffff;
  padding: 3rem 2.8rem;
  border-radius: 22px;
  box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08);
}

/* Close icon */
.cross {
  position: absolute;
  top: 22px;
  right: 24px;
  font-size: 1.4rem;
  color: #94a3b8;
  cursor: pointer;
  transition: 0.2s ease;
}

.cross:hover {
  color: #6366f1;
  transform: scale(1.15);
}

/* Heading */
.title {
  font-size: 2rem;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 0.4rem;
}

.message {
  font-size: 0.95rem;
  color: #64748b;
  margin-bottom: 2rem;
}

/* Layout */
.flex {
  display: flex;
  gap: 1rem;
}

/* Inputs */
label {
  display: block;
  width: 100%;
  margin-bottom: 1.3rem;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  font-size: 0.95rem;
  outline: none;
  transition: 0.25s ease;
}

.input::placeholder {
  color: #94a3b8;
}

.input:focus {
  border-color: #7c6cf6;
  box-shadow: 0 0 0 4px rgba(124, 108, 246, 0.15);
}

/* Remove floating labels look */
label {
  position: relative;
}

label span {
  position: absolute;
  top: -9px;
  left: 14px;
  background: #fff;
  padding: 0 6px;
  font-size: 0.75rem;
  color: #94a3b8;
}


/* Button */
.submit {
  width: 100%;
  margin-top: 0.5rem;
  padding: 15px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #6d6af6, #8b5cf6);
  color: #ffffff;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s ease;
}

.submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(109, 106, 246, 0.4);
}

/* Footer text */
.signin {
  margin-top: 1.6rem;
  text-align: center;
  font-size: 0.9rem;
  color: #64748b;
}

.signin a {
  color: #6366f1;
  font-weight: 600;
  text-decoration: none;
}

.signin a:hover {
  text-decoration: underline;
}

/* Mobile */
@media (max-width: 480px) {
  .form {
    width: 92%;
    padding: 2.4rem 2rem;
  }
}


</style>

</head>
<body>


    <!-- From Uiverse.io by marc_remus --> 
     
<form class="form " method="post" action="">
  {% csrf_token %}
  <a href="{% url 'index' %}"><h2 class="cross"><i class="fa-solid fa-x"></i></h2></a>
  <p class="title">Login</p>
  {% csrf_token %}
        {% for fm in form  %}
          {{fm.label_tag}}{{fm}} {{fm.errors|striptags}}
        {% endfor %}

  <button class="submit">Change Password</button>
  
</form>
</body>
</html>
