<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 40px 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .icon {
      width: 70px;
      height: 70px;
      background: #4CAF50;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #0072ff;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn:hover {
      background: #005ad9;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">✓</div>

    <h2>Password Reset Successful</h2>

    <p>
      Your password has been changed successfully.
      You can now log in using your new password.
    </p>

    <a href="{% url 'log_in' %}" class="btn">Login Now</a>
  </div>

</body>
</html>
